name: Regenradar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: regenradar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: radar/environment.yml
          cache-environment: true
      - name: Radarkarten erzeugen
        shell: micromamba-shell {0}
        run: |
          mkdir -p site/radar
          echo "Regenradar-Daten (DWD Open Data)" > site/index.html
          python radar/radar.py --out site/radar > site/log.txt 2>&1 || echo "FEHLER: Skript endete mit Code $?" >> site/log.txt
          echo "--- Dateien ---" >> site/log.txt
          find site -type f | head -60 >> site/log.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
